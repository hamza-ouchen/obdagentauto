name: AutoDiag validation
"on":
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.lock.txt
      - name: Suite de tests sans appel fournisseur
        run: python -m unittest discover -s tests -v
      - name: Construction Docker
        run: docker build -t autodiag:test .
      - name: Verification du conteneur
        run: |
          docker run -d --name autodiag-test -p 10000:10000 autodiag:test
          for i in $(seq 1 30); do
            if curl --fail http://127.0.0.1:10000/api/health; then break; fi
            sleep 2
          done
          curl --fail http://127.0.0.1:10000/api/health
          curl --fail http://127.0.0.1:10000/ > /dev/null
      - name: Logs du conteneur
        if: always()
        run: docker logs autodiag-test || true
